# /etc/chrony/conf.d/makestep.conf  (or at the end of chrony.conf)
#
# Allows stepping without a count limit. Immediate correction right after resume is
# clockfix's job, but chrony has to be able to recover on its own when that fails —
# the default policy allows a step only a few times right after startup and closes
# the gap by slewing thereafter, which effectively cannot recover an error of
# thousands of seconds. On a virtual guest the clock stops entirely while the host
# sleeps, so that situation is routine.
#
# 1  = for any error larger than 1 second
# -1 = step, with no limit on the number of times
makestep 1 -1
