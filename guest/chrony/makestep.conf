# /etc/chrony/conf.d/makestep.conf  (또는 chrony.conf 말미)
#
# 횟수 제한 없는 step 을 허용한다. resume 직후의 즉시 교정은 clockfix 가 담당하지만,
# 그것이 실패했을 때 chrony 가 스스로 복구할 수 있어야 한다 — 기본 정책은 기동 직후
# 몇 회만 step 을 허용하고 이후에는 slew 로만 좁히므로, 수천 초 오차를 사실상 복구하지
# 못한다. 가상 게스트는 호스트 수면 중 시계가 통째로 멈추므로 이 상황이 일상이다.
#
# 1  = 1초를 넘는 오차에 대해
# -1 = 횟수 제한 없이 step
makestep 1 -1
